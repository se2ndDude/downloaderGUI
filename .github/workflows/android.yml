name: Build LinkDrop APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for syntax checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Compile Python files
        run: python -m compileall -q main.py

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: 1.5.0
          command: buildozer android debug

      - name: Upload all APK variants
        uses: actions/upload-artifact@v4
        with:
          name: LinkDrop-APKs
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
