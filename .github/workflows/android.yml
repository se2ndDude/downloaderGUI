name: Build DownloaderGUI APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python source
        run: python -m compileall -q main.py

      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Pull official Buildozer image
        run: docker pull ghcr.io/kivy/buildozer:1.6.0

      - name: Build debug APK
        run: |
          mkdir -p "$HOME/.buildozer"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -w /home/user/hostcwd \
            ghcr.io/kivy/buildozer:1.6.0 \
            android debug

      - name: List generated APKs
        run: |
          echo "Generated APK files:"
          find bin -maxdepth 1 -type f -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DownloaderGUI-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
