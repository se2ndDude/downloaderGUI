name: Build DownloaderGUI APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.6.0 Cython==0.29.34 virtualenv

      - name: Validate source
        run: python -m compileall -q main.py

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: buildozer -v android debug

      - name: Show generated APKs
        if: always()
        run: |
          echo "APK output:"
          find bin -maxdepth 1 -type f -name "*.apk" -print -exec ls -lh {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DownloaderGUI-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
