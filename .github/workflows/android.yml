name: Build DownloaderGUI APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-venv autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Install Buildozer and build Python tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.6.0 Cython==0.29.34 virtualenv

      - name: Validate source
        run: python -m compileall -q main.py

      - name: Show tool versions
        run: |
          python --version
          java -version
          rustc --version
          buildozer --version

      - name: Start from a clean Buildozer state
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -rf python-for-android
          mkdir -p bin

      - name: Clone pinned python-for-android release
        run: |
          git clone --depth 1 --branch v2026.05.09 https://github.com/kivy/python-for-android.git python-for-android
          test -d python-for-android/pythonforandroid
          python -m compileall -q python-for-android/pythonforandroid

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: buildozer -v android debug

      - name: Show generated APKs
        if: always()
        run: |
          echo "APK output:"
          find bin -maxdepth 1 -type f -name "*.apk" -print -exec ls -lh {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DownloaderGUI-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
